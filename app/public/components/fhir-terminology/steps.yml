# FHIR terminology server dialect — generation 2
#
#   kind   terminology-server      the server the operations go to
#
#   Client fetches the test material from "https://raw.githubusercontent.com/HL7/fhir-tx-ecosystem-ig/<commit>/tests/"
#   TxServer is given the resources:          | resource | (paths under the material)
#   Client expands on TxServer with:          """ Parameters """
#   Client validates a code on TxServer with:
#   Client validates a code against the code system on TxServer with:
#   Client looks up a code on TxServer with:
#   Client tests subsumption on TxServer with:
#   Client translates on TxServer with:
#   Client compares value sets on TxServer with:
#   Client validates a batch on TxServer with:
#   Client reads the capability statement of TxServer as $caps
#   Client reads the terminology capabilities of TxServer as $caps
#   $response should match the pattern in "simple/simple-expand-all-response-valueSet.json"
#   $response should match one of the patterns in:          | pattern | (one match is enough)
#
# The server is named in every operation (`on TxServer`) because it is usually
# the system under test, and "is the system under test" carries no kind.
#
# How a request is built — the way the HL7 runner (TxTester) builds it: the
# Parameters in the step, plus one `tx-resource` parameter for each resource
# the server was given. The runner also appends a profile (`uuid` and the
# version parameters); the generator puts those in the step's Parameters so the
# reader sees them. The operation verbs do NOT assert the HTTP status: for
# these tests the status is an outcome — `$response.status should be 200`.
#
# How a response is judged: the upstream expected file is a matchetype ($id$,
# $uuid$, $instant$, $choice:…$, $optional-properties$, $optional$) fetched
# from the test material and handed as it is to the FHIR validator's
# /itb/matchetype service. What that service does today (measured against the
# 2026-09 build): placeholders and $choice$ work; arrays are compared in
# order; $optional-properties$ and $optional$ are NOT honoured (an element
# left out fails). The HL7 runner sorts the actual response (parameters by
# name, expansion.contains by code, issues by severity/code) and strips
# issue.diagnostics before comparing. Those normalisations belong in the
# matchetype service, not here — until then a semantically right answer in a
# different order fails.
id: fhir-terminology
name: FHIR Terminology Server Steps
language: 2
description: >
  Terminology operations against a terminology server, with the request
  composed the way the HL7 terminology-ecosystem test runner composes it.

kinds: [terminology-server]

# Requests to the server go with the core's header map, so `set header
# "Accept-Language" to "en"` (a core step) applies to them.
x-fhir-json: &fhirJson
  - assign: { to: 'jsonHeaders{Content-Type}', value: '"application/fhir+json"' }
  - assign: { to: 'jsonHeaders{Accept}', value: '"application/fhir+json"' }

# Fetching test material uses its own headers, so the server's headers never
# leak to the material host.
x-fetch: &fetchHeaders
  - assign: { to: 'txFetchHeaders{Accept}', value: '"application/json"' }

# The request Parameters with the suite resources appended inside its
# parameter array: `keep_before_last("]")` cuts the request just before the
# closing bracket of `parameter`, the last `]` in a Parameters resource.
#
# Two ways in. `with:` inlines the Parameters, which reads best and is what an
# author writes. `with the request in "file"` names a file of the test material
# instead, for a payload a TDL expression cannot carry: ITB allows no backslash
# in an expression (TDL-042), so a request holding an apostrophe or any JSON
# escape has to travel as a fetched file rather than as text in the feature.
x-compose: &compose
  - assign: { to: 'txParams{request}', value: "'$docString'" }
  - assign: { to: 'txParams{resources}', value: '$txResourceParams' }
  - process:
      handler: 'TemplateProcessor'
      operation: 'process'
      output: 'txBody'
      inputs:
        syntax: '"freemarker"'
        template: "'${request?keep_before_last(\"]\")}${resources}]}'"
        parameters: '$txParams'

# The same composition, with the request and the runner's parameters fetched
# from the test material: request + the parameter array of the profile + the
# suite resources, all inside the request's own parameter array.
x-compose-file: &composeFile
  - *fetchHeaders
  # Slots: $1 the client, $2 the server, $3 the request file, $4 the parameters.
  - send:
      id: 'txRequestFetch'
      desc: 'Fetch request $3'
      handler: 'HttpMessagingV2'
      inputs:
        uri: 'concat($txTestsBase, "$3")'
        method: '"GET"'
        headers: '$txFetchHeaders'
  - send:
      id: 'txProfileFetch'
      desc: 'Fetch parameters $4'
      handler: 'HttpMessagingV2'
      inputs:
        uri: 'concat($txTestsBase, "$4")'
        method: '"GET"'
        headers: '$txFetchHeaders'
  - assign: { to: 'txParams{request}', value: '$txRequestFetch{response}{body}', type: 'string' }
  - assign: { to: 'txParams{profile}', value: '$txProfileFetch{response}{body}', type: 'string' }
  - assign: { to: 'txParams{resources}', value: '$txResourceParams' }
  - process:
      handler: 'TemplateProcessor'
      operation: 'process'
      output: 'txBody'
      inputs:
        syntax: '"freemarker"'
        template: "'${request?keep_before_last(\"]\")},${profile?keep_after(\"[\")?keep_before_last(\"]\")}${resources}]}'"
        parameters: '$txParams'

verbs:
  - text: '{actor} fetches the test material from {string}'
    doc: Where the test set's files are read from (the raw GitHub URL of the upstream tests folder, or any HTTP folder).
    actions:
      - assign: { to: 'txTestsBase', value: '"$2"' }
      - assign: { to: 'txResourceParams', value: '""' }

  - text: '{actor:terminology-server} is given the resources:'
    doc: The CodeSystems and ValueSets a suite depends on (table | resource |, paths under the test material); they travel with every request as tx-resource parameters.
    table:
      required: [resource]
    actions:
      - *fetchHeaders
      - foreach:
          from: '$tableRows'
          do:
            - send:
                id: 'txMaterialRequest'
                desc: 'Fetch $row.resource'
                handler: 'HttpMessagingV2'
                inputs:
                  uri: 'concat($txTestsBase, "$row.resource")'
                  method: '"GET"'
                  headers: '$txFetchHeaders'
            # As a string first: concat() on a byte[] body is not a string operation.
            - assign: { to: 'txMaterialBody', value: '$txMaterialRequest{response}{body}', type: 'string' }
            - assign:
                to: 'txResourceParams'
                value: "concat($txResourceParams, ',{\"name\":\"tx-resource\",\"resource\":', $txMaterialBody, '}')"

  - text: '{actor} expands on {actor:terminology-server} with:'
    doc: ValueSet/$expand with the doc string as the request Parameters.
    actions:
      - *compose
      - *fhirJson
      - send:
          id: 'lastRequest'
          desc: 'POST /ValueSet/$expand'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/ValueSet/$expand")'
            method: '"POST"'
            headers: '$jsonHeaders'
            body: '$txBody'

  - text: '{actor} validates a code on {actor:terminology-server} with:'
    doc: ValueSet/$validate-code.
    actions:
      - *compose
      - *fhirJson
      - send:
          id: 'lastRequest'
          desc: 'POST /ValueSet/$validate-code'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/ValueSet/$validate-code")'
            method: '"POST"'
            headers: '$jsonHeaders'
            body: '$txBody'

  - text: '{actor} validates a code against the code system on {actor:terminology-server} with:'
    doc: CodeSystem/$validate-code.
    actions:
      - *compose
      - *fhirJson
      - send:
          id: 'lastRequest'
          desc: 'POST /CodeSystem/$validate-code'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/CodeSystem/$validate-code")'
            method: '"POST"'
            headers: '$jsonHeaders'
            body: '$txBody'

  - text: '{actor} looks up a code on {actor:terminology-server} with:'
    doc: CodeSystem/$lookup.
    actions:
      - *compose
      - *fhirJson
      - send:
          id: 'lastRequest'
          desc: 'POST /CodeSystem/$lookup'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/CodeSystem/$lookup")'
            method: '"POST"'
            headers: '$jsonHeaders'
            body: '$txBody'

  - text: '{actor} tests subsumption on {actor:terminology-server} with:'
    doc: CodeSystem/$subsumes.
    actions:
      - *compose
      - *fhirJson
      - send:
          id: 'lastRequest'
          desc: 'POST /CodeSystem/$subsumes'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/CodeSystem/$subsumes")'
            method: '"POST"'
            headers: '$jsonHeaders'
            body: '$txBody'

  - text: '{actor} translates on {actor:terminology-server} with:'
    doc: ConceptMap/$translate.
    actions:
      - *compose
      - *fhirJson
      - send:
          id: 'lastRequest'
          desc: 'POST /ConceptMap/$translate'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/ConceptMap/$translate")'
            method: '"POST"'
            headers: '$jsonHeaders'
            body: '$txBody'

  - text: '{actor} compares value sets on {actor:terminology-server} with:'
    doc: ValueSet/$compare (thisUrl / otherUrl), as tx.fhir.org serves it.
    actions:
      - *compose
      - *fhirJson
      - send:
          id: 'lastRequest'
          desc: 'POST /ValueSet/$compare'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/ValueSet/$compare")'
            method: '"POST"'
            headers: '$jsonHeaders'
            body: '$txBody'

  - text: '{actor} validates a batch on {actor:terminology-server} with:'
    doc: ValueSet/$batch-validate-code — several codes in one request.
    actions:
      - *compose
      - *fhirJson
      - send:
          id: 'lastRequest'
          desc: 'POST /ValueSet/$batch-validate-code'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/ValueSet/$batch-validate-code")'
            method: '"POST"'
            headers: '$jsonHeaders'
            body: '$txBody'


  # ── The same operations, with the request named rather than written out ──
  # For a request whose JSON cannot live in a TDL expression, and for a
  # generated suite that would rather name the upstream file than copy it.
  # The second file is the runner profile whose parameters are merged in
  # (upstream: parameters-default.json, or one of version/parameters-*.json).

  - text: '{actor} expands on {actor:terminology-server} with the request in {string} and the parameters in {string}'
    doc: ValueSet $expand, with the request Parameters fetched from the test material.
    actions:
      - *composeFile
      - *fhirJson
      - send:
          id: 'lastRequest'
          desc: 'POST /ValueSet/$expand'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/ValueSet/$expand")'
            method: '"POST"'
            headers: '$jsonHeaders'
            body: '$txBody'

  - text: '{actor} validates a code on {actor:terminology-server} with the request in {string} and the parameters in {string}'
    doc: ValueSet $validate-code, with the request Parameters fetched from the test material.
    actions:
      - *composeFile
      - *fhirJson
      - send:
          id: 'lastRequest'
          desc: 'POST /ValueSet/$validate-code'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/ValueSet/$validate-code")'
            method: '"POST"'
            headers: '$jsonHeaders'
            body: '$txBody'

  - text: '{actor} validates a code against the code system on {actor:terminology-server} with the request in {string} and the parameters in {string}'
    doc: CodeSystem $validate-code, with the request Parameters fetched from the test material.
    actions:
      - *composeFile
      - *fhirJson
      - send:
          id: 'lastRequest'
          desc: 'POST /CodeSystem/$validate-code'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/CodeSystem/$validate-code")'
            method: '"POST"'
            headers: '$jsonHeaders'
            body: '$txBody'

  - text: '{actor} looks up a code on {actor:terminology-server} with the request in {string} and the parameters in {string}'
    doc: CodeSystem $lookup, with the request Parameters fetched from the test material.
    actions:
      - *composeFile
      - *fhirJson
      - send:
          id: 'lastRequest'
          desc: 'POST /CodeSystem/$lookup'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/CodeSystem/$lookup")'
            method: '"POST"'
            headers: '$jsonHeaders'
            body: '$txBody'

  - text: '{actor} tests subsumption on {actor:terminology-server} with the request in {string} and the parameters in {string}'
    doc: CodeSystem $subsumes, with the request Parameters fetched from the test material.
    actions:
      - *composeFile
      - *fhirJson
      - send:
          id: 'lastRequest'
          desc: 'POST /CodeSystem/$subsumes'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/CodeSystem/$subsumes")'
            method: '"POST"'
            headers: '$jsonHeaders'
            body: '$txBody'

  - text: '{actor} translates on {actor:terminology-server} with the request in {string} and the parameters in {string}'
    doc: ConceptMap $translate, with the request Parameters fetched from the test material.
    actions:
      - *composeFile
      - *fhirJson
      - send:
          id: 'lastRequest'
          desc: 'POST /ConceptMap/$translate'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/ConceptMap/$translate")'
            method: '"POST"'
            headers: '$jsonHeaders'
            body: '$txBody'

  - text: '{actor} compares value sets on {actor:terminology-server} with the request in {string} and the parameters in {string}'
    doc: ValueSet $compare, with the request Parameters fetched from the test material.
    actions:
      - *composeFile
      - *fhirJson
      - send:
          id: 'lastRequest'
          desc: 'POST /ValueSet/$compare'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/ValueSet/$compare")'
            method: '"POST"'
            headers: '$jsonHeaders'
            body: '$txBody'

  - text: '{actor} validates a batch on {actor:terminology-server} with the request in {string} and the parameters in {string}'
    doc: ValueSet $batch-validate-code, with the request Parameters fetched from the test material.
    actions:
      - *composeFile
      - *fhirJson
      - send:
          id: 'lastRequest'
          desc: 'POST /ValueSet/$batch-validate-code'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/ValueSet/$batch-validate-code")'
            method: '"POST"'
            headers: '$jsonHeaders'
            body: '$txBody'

  - text: '{actor} reads the capability statement of {actor:terminology-server} as {var}'
    doc: GET /metadata.
    actions:
      - *fhirJson
      - send:
          id: 'lastRequest'
          desc: 'GET /metadata'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/metadata")'
            method: '"GET"'
            headers: '$jsonHeaders'
      - assign: { to: '$3', value: '$lastRequest{response}{body}', type: 'string' }

  - text: '{actor} reads the terminology capabilities of {actor:terminology-server} as {var}'
    doc: GET /metadata?mode=terminology.
    actions:
      - *fhirJson
      - send:
          id: 'lastRequest'
          desc: 'GET /metadata?mode=terminology'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/metadata?mode=terminology")'
            method: '"GET"'
            headers: '$jsonHeaders'
      - assign: { to: '$3', value: '$lastRequest{response}{body}', type: 'string' }

  # The upstream expected-response file IS a matchetype: it is fetched from the
  # test material and used as the pattern, verbatim. Same comparison as the core
  # `should match pattern:` step, with the pattern in a file rather than inline.
  # The validator is the one declared as a fhir-validator unless named.
  # Two ways to compare, and they are the service's two modes.
  #
  #   complete  the response must match the file, wildcards aside
  #   partial   the file is the minimum the response must contain
  #
  # Both ask the service to normalise the response first (normalize=tx): the
  # expectation files are stored in the order the terminology test runner's
  # sorters produce, so without it a correct response fails on array order.
  - text: '{ref} should match the pattern in {string}( on {actor:fhir-validator})?'
    doc: Compare a value with a matchetype held in a file of the test material, through the FHIR validator.
    actions:
      - *fetchHeaders
      - send:
          id: 'txExpectedRequest'
          desc: 'Fetch pattern $2'
          handler: 'HttpMessagingV2'
          inputs:
            uri: 'concat($txTestsBase, "$2")'
            method: '"GET"'
            headers: '$txFetchHeaders'
      - assign: { to: 'matchTplParams{mode}', value: '"complete"' }
      - assign: { to: 'matchTplParams{resource}', value: '$1', type: 'string' }
      - assign: { to: 'matchTplParams{matchetype}', value: '$txExpectedRequest{response}{body}', type: 'string' }
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'matchBody'
          inputs:
            syntax: '"freemarker"'
            template: "'{ \"input\": [ { \"name\": \"contentToValidate\", \"value\": \"${resource?json_string}\", \"embeddingMethod\": \"STRING\" }, { \"name\": \"matchetype\", \"value\": \"${matchetype?json_string}\", \"embeddingMethod\": \"STRING\" }, { \"name\": \"normalize\", \"value\": \"tx\", \"embeddingMethod\": \"STRING\" }, { \"name\": \"mode\", \"value\": \"${mode}\", \"embeddingMethod\": \"STRING\" } ] }'"
            parameters: '$matchTplParams'
      - assign: { to: 'matchHeaders{Content-Type}', value: '"application/json"' }
      - assign: { to: 'matchHeaders{Accept}', value: '"application/json"' }
      - send:
          id: 'matchRequest'
          desc: 'Matchetype: $2'
          handler: 'HttpMessagingV2'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/itb/matchetype/validate")'
            method: '"POST"'
            headers: '$matchHeaders'
            body: '$matchBody'
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'matchResult', inputs: { content: '$matchRequest{response}{body}', pointer: '"/report/result"' } }
      - verify:
          handler: 'StringValidator'
          desc: '$$1 matches the pattern in $2'
          inputs: { actualstring: '$matchResult', expectedstring: '"SUCCESS"' }

  # Several acceptable answers (upstream "response2", "response:flat",
  # "response:tx.fhir.org"): compare against each pattern, judge once. The rows
  # are unrolled at compile time, so the verdict is accumulated row by row.
  - text: '{ref} should contain the pattern in {string}( on {actor:fhir-validator})?'
    doc: The file lists what the value must contain; anything it does not mention is allowed. For the capability statements, whose expected files state the minimum.
    actions:
      - *fetchHeaders
      - send:
          id: 'txExpectedRequest'
          desc: 'Fetch pattern $2'
          handler: 'HttpMessagingV2'
          inputs:
            uri: 'concat($txTestsBase, "$2")'
            method: '"GET"'
            headers: '$txFetchHeaders'
      - assign: { to: 'matchTplParams{mode}', value: '"partial"' }
      - assign: { to: 'matchTplParams{resource}', value: '$1', type: 'string' }
      - assign: { to: 'matchTplParams{matchetype}', value: '$txExpectedRequest{response}{body}', type: 'string' }
      - process:
          handler: 'TemplateProcessor'
          operation: 'process'
          output: 'matchBody'
          inputs:
            syntax: '"freemarker"'
            template: "'{ \"input\": [ { \"name\": \"contentToValidate\", \"value\": \"${resource?json_string}\", \"embeddingMethod\": \"STRING\" }, { \"name\": \"matchetype\", \"value\": \"${matchetype?json_string}\", \"embeddingMethod\": \"STRING\" }, { \"name\": \"normalize\", \"value\": \"tx\", \"embeddingMethod\": \"STRING\" }, { \"name\": \"mode\", \"value\": \"${mode}\", \"embeddingMethod\": \"STRING\" } ] }'"
            parameters: '$matchTplParams'
      - assign: { to: 'matchHeaders{Content-Type}', value: '"application/json"' }
      - assign: { to: 'matchHeaders{Accept}', value: '"application/json"' }
      - send:
          id: 'matchRequest'
          desc: 'Matchetype: $2'
          handler: 'HttpMessagingV2'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/itb/matchetype/validate")'
            method: '"POST"'
            headers: '$matchHeaders'
            body: '$matchBody'
      - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'matchResult', inputs: { content: '$matchRequest{response}{body}', pointer: '"/report/result"' } }
      - verify:
          handler: 'StringValidator'
          desc: '$$1 contains the pattern in $2'
          inputs: { actualstring: '$matchResult', expectedstring: '"SUCCESS"' }

  # Several acceptable answers (upstream "response2", "response:flat",
  # "response:tx.fhir.org"): compare against each pattern, judge once. The rows
  # are unrolled at compile time, so the verdict is accumulated row by row.
  - text: '{ref} should match one of the patterns in:( on {actor:fhir-validator})?'
    doc: Compare a value with each of several matchetype files (table | pattern |); one match is enough.
    table:
      required: [pattern]
    actions:
      - *fetchHeaders
      - assign: { to: 'matchHeaders{Content-Type}', value: '"application/json"' }
      - assign: { to: 'matchHeaders{Accept}', value: '"application/json"' }
      - assign: { to: 'anyMatch', value: '"false"' }
      - assign: { to: 'matchTplParams{mode}', value: '"complete"' }
      - assign: { to: 'matchTplParams{resource}', value: '$1', type: 'string' }
      - foreach:
          from: '$tableRows'
          do:
            - send:
                id: 'txExpectedRequest'
                desc: 'Fetch pattern $row.pattern'
                handler: 'HttpMessagingV2'
                inputs:
                  uri: 'concat($txTestsBase, "$row.pattern")'
                  method: '"GET"'
                  headers: '$txFetchHeaders'
            - assign: { to: 'matchTplParams{matchetype}', value: '$txExpectedRequest{response}{body}', type: 'string' }
            - process:
                handler: 'TemplateProcessor'
                operation: 'process'
                output: 'matchBody'
                inputs:
                  syntax: '"freemarker"'
                  template: "'{ \"input\": [ { \"name\": \"contentToValidate\", \"value\": \"${resource?json_string}\", \"embeddingMethod\": \"STRING\" }, { \"name\": \"matchetype\", \"value\": \"${matchetype?json_string}\", \"embeddingMethod\": \"STRING\" }, { \"name\": \"normalize\", \"value\": \"tx\", \"embeddingMethod\": \"STRING\" }, { \"name\": \"mode\", \"value\": \"${mode}\", \"embeddingMethod\": \"STRING\" } ] }'"
                  parameters: '$matchTplParams'
            - send:
                id: 'matchRequest'
                desc: 'Matchetype: $row.pattern'
                handler: 'HttpMessagingV2'
                to: '$target'
                inputs:
                  uri: 'concat($targetBase, "/itb/matchetype/validate")'
                  method: '"POST"'
                  headers: '$matchHeaders'
                  body: '$matchBody'
            - process: { handler: 'JsonPointerProcessor', operation: 'process', output: 'matchResult', inputs: { content: '$matchRequest{response}{body}', pointer: '"/report/result"' } }
            - assign: { to: 'anyMatch', value: 'if ($matchResult = "SUCCESS") then "true" else $anyMatch' }
      - verify:
          handler: 'ExpressionValidator'
          desc: '$$1 matches one of the patterns'
          inputs: { expression: '$anyMatch = "true"' }

  # ==================================================================
  # DELEGATING THE WHOLE TEST TO THE HL7 RUNNER
  # ==================================================================

  # The verbs above build the request and judge the answer here, through
  # /itb/matchetype. That comparator is NOT the one the upstream tests were
  # written against: they are authored for TxTester, which scrubs the response
  # (issue.diagnostics, meta, unmanaged extensions) and then compares with
  # CompareUtilities, whose placeholder vocabulary is larger —
  #
  #   $count-arrays$ $date$ $id$ $instant$ $only$ $optional$
  #   $optional-properties$ $semver$ $string$ $token$ $url$ $uuid$ $version$
  #
  # Measured 2026-10-25 against tx.fhir.org: the upstream capstmt.json uses
  # $url$, $token$, $string$, $date$, $semver$ and $version$, none of which
  # /itb/matchetype knows, so it compares the literal "$url$" against a real
  # URL and the test fails although the server is correct.
  #
  # This verb hands the whole test to the runner instead — the validator's
  # /txTest endpoint is TxTester itself, so the request is built, sent, scrubbed
  # and compared exactly as upstream does it. Correct by construction, and it
  # tracks upstream without us reimplementing anything.
  #
  # THE TRADE, and it is why the verbs above still exist: this is one opaque
  # step. A failure says which test failed, not which field of which response.
  # Prefer the step-by-step verbs while their comparison is adequate, and reach
  # for this one when the expected file uses placeholders /itb/matchetype does
  # not understand, or when agreement with the HL7 runner is the point.
  - text: '{actor} runs the upstream tx test {string} of suite {string} against {actor}( on {actor:fhir-validator})?'
    doc: Run one test of the HL7 terminology-ecosystem suite through the validator's TxTester, which builds the request and judges the answer the way the upstream runner does.
    actions:
      - assign: { to: 'txRunHeaders{Accept}', value: '"application/json"' }
      - send:
          id: 'txRunRequest'
          desc: 'TxTester: $3/$2 against $4.raw'
          handler: 'HttpMessagingV2'
          from: '$1'
          to: '$target'
          inputs:
            uri: 'concat($targetBase, "/txTest?suite=$3&test=$2&server=", $$4Base)'
            method: '"GET"'
            headers: '$txRunHeaders'
      - verify:
          handler: 'NumberValidator'
          desc: 'The runner answered (HTTP 200)'
          inputs: { actualnumber: '$txRunRequest{response}{status}', expectednumber: '"200"' }
      # The runner answers with an OperationOutcome: information on a pass,
      # error on a failure. Asserting "not an error" rather than a specific
      # success severity, so a future change of wording does not read as a pass.
      - process:
          handler: 'JsonPointerProcessor'
          operation: 'process'
          output: 'txRunSeverity'
          inputs: { content: '$txRunRequest{response}{body}', pointer: '"/issue/0/severity"' }
      - verify:
          handler: 'ExpressionValidator'
          desc: 'tx test $3/$2 passed'
          inputs: { expression: 'not($txRunSeverity = "error") and not($txRunSeverity = "fatal")' }
